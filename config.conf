# ---- where alerts go ----------------------------------------------------
EMAIL_TO   = send@getuk.support
EMAIL_FROM = sitewatch@getuk.support

# ---- how they get sent --------------------------------------------------
# IMPORTANT: this box has outbound port 25 BLOCKED by IONOS and no PTR record,
# so the local mail server will queue alerts forever and never deliver them.
# Fill in ONE of the two below or you will not receive anything.
#
# 1) authenticated relay through a real mailbox (recommended - gets SPF/DKIM)
SMTP_HOST =
SMTP_PORT = 587
SMTP_USER =
SMTP_PASS =
#
# 2) or a Slack / Teams / Discord incoming webhook (goes over 443, always works)
WEBHOOK_URL =

# ---- checking behaviour -------------------------------------------------
TIMEOUT = 20
RETRIES = 2
RETRY_WAIT = 10
